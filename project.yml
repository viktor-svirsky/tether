name: Tether
options:
  bundleIdPrefix: com.vsvirskyi
  deploymentTarget:
    iOS: "17.0"
  # Builds the WireGuard server (Go) into WireGuard/build/TetherWG.xcframework. Skips when unchanged.
  preGenCommand: scripts/build-wireguard.sh
settings:
  base:
    DEVELOPMENT_TEAM: 33TVZ53MZ2 # your team ID, see Xcode > Settings > Accounts
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # The app's bundle ID. Pass APP_BUNDLE_ID to xcodebuild to change it.
    APP_BUNDLE_ID: com.vsvirskyi.phoneshare
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1" # the built app gets the commit count instead, see postBuildScripts
targets:
  Tether:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - framework: WireGuard/build/TetherWG.xcframework
        embed: false # a static library, linked into the app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tether
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Tether accepts connections from your devices on the hotspot network.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # The build number is the commit count, so each build on the iPhone can be told apart
    # (Settings > General > iPhone Storage > Tether). It runs before Xcode signs the app.
    postBuildScripts:
      - name: Build number from git
        basedOnDependencyAnalysis: false
        # The processed Info.plist as input makes it wait for Xcode to write that file.
        # Without it the two can run in parallel, and Xcode overwrites the number.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(git -C "$SRCROOT" rev-list --count HEAD)" \
            "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  TetherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Tether
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vsvirskyi.phoneshare.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tether:
    build:
      targets:
        Tether: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [TetherUITests]
