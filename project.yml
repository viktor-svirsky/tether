name: Tether
options:
  bundleIdPrefix: com.vsvirskyi
  deploymentTarget:
    iOS: "17.0"
  # Builds the WireGuard server (Go) into WireGuard/build/TetherWG.xcframework. Skips when unchanged.
  preGenCommand: scripts/build-wireguard.sh
settings:
  base:
    DEVELOPMENT_TEAM: 33TVZ53MZ2 # your team ID, see Xcode > Settings > Accounts
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # The app's bundle ID. Pass APP_BUNDLE_ID to xcodebuild to change it.
    APP_BUNDLE_ID: com.vsvirskyi.phoneshare
    MARKETING_VERSION: "" # the release passes its version, and other builds take the last one, see postBuildScripts
    CURRENT_PROJECT_VERSION: "1" # the built app gets the commit count instead, see postBuildScripts
targets:
  Tether:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - framework: WireGuard/build/TetherWG.xcframework
        embed: false # a static library, linked into the app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1" # iPhone only: an iPad runs it in an iPhone-sized window (#182)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tether
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Your devices connect to Tether over the hotspot. Without this, Tether can't answer them.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # The build number is the commit count, so each build on the iPhone can be told apart
    # (Settings > General > iPhone Storage > Tether). The version is the release's, and a build
    # outside the release says the last release's, from its tag, like 1.3.0. Without tags (a
    # shallow clone) it's 0.0. It runs before Xcode signs the app.
    postBuildScripts:
      - name: Version and build number from git
        basedOnDependencyAnalysis: false
        # The processed Info.plist as input makes it wait for Xcode to write that file.
        # Without it the two can run in parallel, and Xcode overwrites the number.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # PlistBuddy sets an empty number without complaint, so a failed count stops the build here.
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD) || exit 1
          case $count in
            ''|*[!0-9]*) echo "error: the build number from git is '$count', not a commit count" >&2; exit 1 ;;
          esac
          version=$MARKETING_VERSION
          if [ -z "$version" ]; then
            tag=$(git -C "$SRCROOT" describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*[!0-9.]*' 2>/dev/null) || tag=v0.0
            version=${tag#v}
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          # An empty MARKETING_VERSION leaves the key out, and replace adds it.
          plutil -replace CFBundleShortVersionString -string "$version" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSBonjourServices: [_tether._tcp] # see LocalNetworkCheck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  TetherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Tether
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vsvirskyi.phoneshare.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tether:
    build:
      targets:
        Tether: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [TetherUITests]
