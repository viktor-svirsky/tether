name: Something doesn't work
description: Tether won't install, open, share, or keep running
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A screenshot of Tether's main screen helps.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed Tether
      options:
        - SideStore
        - AltStore
        - Feather or another signing app
        - A paid certificate
        - LiveContainer
        - Built it with Xcode
        - Something else (say which above)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Tether's log
      description: In Tether, tap the gear, then Share the log, and save the file. Drag it in here. It says what Tether did lately, with your keys and full addresses left out.
      placeholder: Drop Tether log.txt here
  - type: input
    id: version
    attributes:
      label: Tether version
      description: The gear on Tether's main screen opens Settings, and About shows it, for example 1.4.0 (83).
    validations:
      required: true
  - type: input
    id: iphone
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 14 Pro, iOS 26.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: The device you share with, and its WireGuard client
      placeholder: iPad with the WireGuard app, GL.iNet router, Windows laptop
