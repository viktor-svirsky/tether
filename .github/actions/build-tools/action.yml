# The tools every workflow needs on GitHub's macOS runner, after actions/checkout: a fixed Xcode,
# Go for WireGuard/, and XcodeGen.
name: Build tools
description: Xcode, Go and XcodeGen
inputs:
  xcode:
    description: The Xcode version, as in /Applications/Xcode_<version>.app on the runner image
    default: "26.6"
runs:
  using: composite
  steps:
    - name: Pick Xcode
      shell: bash
      env:
        XCODE: ${{ inputs.xcode }}
      run: sudo xcode-select -s "/Applications/Xcode_$XCODE.app"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # go.mod says 1.27. The newest 1.27.x, so the app ships, and govulncheck checks, the
        # patched standard library.
        go-version: "1.27"
        check-latest: true
        cache-dependency-path: WireGuard/go.sum
    # One XcodeGen, checked against its SHA-256, so a new release can't change the generated project
    # between a green CI run and a release. Dependabot doesn't see it. To bump it, pick a release on
    # https://github.com/yonaskolb/XcodeGen/releases and copy its version and the sha256 digest that
    # GitHub lists for xcodegen.zip.
    - name: Install XcodeGen
      shell: bash
      env:
        VERSION: "2.46.0"
        SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      run: |
        zip=$RUNNER_TEMP/xcodegen.zip
        curl -fsSL --retry 3 --retry-all-errors -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$VERSION/xcodegen.zip"
        echo "$SHA256  $zip" | shasum -a 256 -c -
        unzip -qo "$zip" -d "$RUNNER_TEMP"
        "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
        echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
