# Weekly pull requests that bump the pinned actions and the Go modules, one for each group. Fixes
# for known vulnerabilities come sooner, from Dependabot security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/build-tools"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # A Go bump changes what the app runs, so it goes to the next release branch and ships after a
  # test on the iPhone (#147). Point this at the new release branch when you start one.
  - package-ecosystem: gomod
    directory: /WireGuard
    target-branch: release-1.9
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
