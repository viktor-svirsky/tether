# Actions > UI tests > Run workflow. The full XCUITest suite takes one to two hours, so it runs on
# demand and not on every push. It runs on the newest iOS GitHub's runners have. Tether supports
# iOS 26 and later, and iOS 27 isn't on the runners yet, so it needs a phone or a Mac with that
# simulator (TESTING.md).
name: UI tests

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

# Nothing by default: each job asks for what it needs.
permissions: {}

jobs:
  ui-tests:
    name: UI tests, iOS ${{ matrix.ios }} on ${{ matrix.device }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 150 # 127 tests took 87 min on iOS 26.5 for 1.10.0 (Nov 16), 3 min short of the old 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.6"
            ios: "26.5"
            device: iPhone 17 Pro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git, and the token shouldn't sit in .git/config
      - uses: ./.github/actions/build-tools
        with:
          xcode: ${{ matrix.xcode }}
      - name: Create a simulator
        env:
          IOS: ${{ matrix.ios }}
          DEVICE: ${{ matrix.device }}
        run: |
          id=$(xcrun simctl create "Tether CI $GITHUB_RUN_ID" "$DEVICE" "com.apple.CoreSimulator.SimRuntime.iOS-${IOS//./-}")
          echo "SIM=$id" >> "$GITHUB_ENV"
      - name: UI tests
        run: |
          xcodegen generate --quiet
          # Every test's line, with its time, so a slow or stuck run shows where. A test that hangs
          # fails after 10 minutes instead of using up the job's time.
          xcodebuild test -project Tether.xcodeproj -scheme Tether -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 600 \
            | grep -E "Test Case .* (passed|failed)|Executed [0-9]+ tests|error:|TEST (SUCCEEDED|FAILED)"
      # The result bundle has a screenshot of every failure. Open it in Xcode.
      - name: Keep the results of a failed run
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UITests-iOS-${{ matrix.ios }}.xcresult
          path: ${{ runner.temp }}/UITests.xcresult
          retention-days: 7
