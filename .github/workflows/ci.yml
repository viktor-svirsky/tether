# Runs on GitHub's macOS runner (building an iOS app needs Xcode). Every job gets a fresh VM, so
# pull requests from forks run it too, with a read-only token.
name: CI

# Every branch push runs it, so a branch is green before it's merged into main.
on:
  pull_request:
  push:
  # Weekly as well, so govulncheck sees new Go advisories, which Dependabot doesn't cover for the
  # standard library, and a runner image that dropped the pinned Xcode shows (#145).
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # named explicitly, so steps run with pipefail and a failed build can't hide behind tail

# Nothing by default: each job asks for what it needs.
permissions: {}

jobs:
  # A commit goes through its issue branch, a batch branch, the release branch and main. The same
  # commit is the same tree, so once a push run passed on any branch, the macOS jobs aren't run again:
  # that was about a third of the macOS minutes, and each rerun was another chance at a flake, which
  # on main quietly cost a release (#144). The weekly run always runs, for govulncheck.
  passed-before:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.look.outputs.passed }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A lookup that fails counts as none, so the macOS jobs run and decide CI's result.
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq .total_count) || count=0
          echo "Push runs that passed on $GITHUB_SHA: $count"
          echo "passed=$([[ $count != 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # The Go server's tests and the app's build and tests run as two jobs at once (#146).
  go:
    name: Go server
    needs: passed-before
    # A branch of this repo already runs on push, so its pull request doesn't run it a second time.
    # !cancelled(), so a pull request or the weekly run, which skip passed-before, still get here,
    # while a newer push still cancels it.
    if: >-
      !cancelled() && needs.passed-before.outputs.passed != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write # Codecov's upload signs in with OIDC on a push, so no token is stored
    timeout-minutes: 30 # an estimate of about 12 minutes: the race run about 3 since #135, fuzzing 4.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git, and the token shouldn't sit in .git/config
      - uses: ./.github/actions/build-tools
      # Every test at full size, then the race detector on the ones that fit its speed. The coverage
      # total goes in the run's summary, so a change that lowers it shows. No threshold.
      - name: WireGuard server tests
        run: |
          go -C WireGuard test -coverprofile="$RUNNER_TEMP/go.cover" ./...
          echo "Go coverage: $(go -C WireGuard tool cover -func="$RUNNER_TEMP/go.cover" | awk 'END { print $NF }') of statements" | tee -a "$GITHUB_STEP_SUMMARY"
      # Per pull request: how much of the changed code the tests reach. A fork's pull request gets
      # no OIDC token, so it uploads without one, which Codecov allows for a public repo. A failed
      # upload doesn't fail CI.
      - name: Upload the Go coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ runner.temp }}/go.cover
          flags: go
          disable_search: true
          use_oidc: ${{ github.event_name != 'pull_request' }}
      - name: WireGuard server tests under the race detector
        # go test stops a run at 10 minutes by default. This one came close to that before #135.
        run: go -C WireGuard test -race -timeout 20m ./...
      # 30 s per target keeps them working. It's a smoke test, not a long fuzz. An input that fails
      # is written to WireGuard/testdata/fuzz, and the next step keeps it.
      - name: Fuzz what devices and the internet send
        id: fuzz
        run: |
          for f in FuzzReplyPackets FuzzTunWrite FuzzResolve FuzzServeTCP FuzzQuestions FuzzEchoReply FuzzNAT64 FuzzFitUDP FuzzProxyTarget; do
            go -C WireGuard test -run '^$' -fuzz "^$f\$" -fuzztime 30s . || exit 1
          done
      - name: Keep the input the fuzzer failed on
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-input
          path: WireGuard/testdata/fuzz
      # Fails only on a known vulnerability that Tether's code can reach. Pinned, like the actions.
      - name: Known vulnerabilities
        run: go -C WireGuard run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  app:
    name: App
    needs: passed-before
    # The same as the Go job's.
    if: >-
      !cancelled() && needs.passed-before.outputs.passed != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write # Codecov's upload, as in the Go job
    timeout-minutes: 30 # an estimate of about 4 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git, and the token shouldn't sit in .git/config
          fetch-depth: 0 # build-ipa.sh needs the commit count for the build number
      - uses: ./.github/actions/build-tools
      - name: Build the WireGuard server
        run: scripts/build-wireguard.sh # swift test links its macOS slice
      # The coverage total of Sources/ goes in the run's summary, like the Go one.
      - name: Unit tests
        run: |
          swift test --enable-code-coverage
          python3 - "$(swift test --show-codecov-path)" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          files = json.load(open(sys.argv[1]))["data"][0]["files"]
          lines = [f["summary"]["lines"] for f in files if "/Sources/" in f["filename"] and "/.build/" not in f["filename"]]
          covered, count = sum(l["covered"] for l in lines), sum(l["count"] for l in lines)
          print(f"Swift coverage: {100 * covered / count:.1f}% of lines in Sources/")
          EOF
          # The bundle's name depends on the Xcode version (TetherTests or TetherPackageTests).
          xctests=("$(swift build --show-bin-path)"/*.xctest)
          xctest=${xctests[0]}
          xcrun llvm-cov export -format=lcov "$xctest/Contents/MacOS/$(basename "$xctest" .xctest)" \
            -instr-profile "$(swift build --show-bin-path)/codecov/default.profdata" \
            -ignore-filename-regex='(\.build|/Tests/)' > "$RUNNER_TEMP/swift.lcov"
      - name: Upload the Swift coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ runner.temp }}/swift.lcov
          flags: swift
          disable_search: true
          use_oidc: ${{ github.event_name != 'pull_request' }}
      - name: Release script tests
        run: |
          python3 scripts/test_make_source.py
          scripts/test-next-version.sh
          scripts/test-which-release.sh
          scripts/test-release-notes.sh
          scripts/test-never-started.sh
      # The whole xcodebuild log goes to a file, kept when the build fails. The job's log shows its
      # errors and its end.
      - name: Build the app
        run: |
          xcodegen generate --quiet
          log=$RUNNER_TEMP/logs/build-app.log
          mkdir -p "$(dirname "$log")"
          if ! xcodebuild -project Tether.xcodeproj -scheme Tether \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/dd" build > "$log" 2>&1; then
              awk '/(^| )error: / && n++ < 20' "$log"
              tail -20 "$log"
              exit 1
          fi
          tail -3 "$log"
      # The same unsigned Release build a tag publishes, so a release can't be the first to find it broken.
      - name: Build Tether.ipa
        run: scripts/build-ipa.sh 0.0.0 "$RUNNER_TEMP/ipa"
      - name: Keep the build logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/logs
            ${{ runner.temp }}/ipa/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
