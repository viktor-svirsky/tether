# Runs on GitHub's macOS runner (building an iOS app needs Xcode). Every job gets a fresh VM, so
# pull requests from forks run it too, with a read-only token.
name: CI

# Every branch push runs it, so a branch is green before it's merged into main.
on:
  pull_request:
  push:
  # Weekly as well, so govulncheck sees new Go advisories, which Dependabot doesn't cover for the
  # standard library, and a runner image that dropped the pinned Xcode shows (#145).
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # named explicitly, so steps run with pipefail and a failed build can't hide behind tail

jobs:
  # A commit goes through its issue branch, a batch branch, the release branch and main. The same
  # commit is the same tree, so once a push run passed on any branch, the macOS job isn't run again:
  # that was about a third of the macOS minutes, and each rerun was another chance at a flake, which
  # on main quietly cost a release (#144). The weekly run always runs, for govulncheck.
  passed-before:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.look.outputs.passed }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A lookup that fails counts as none, so the macOS job runs and decides CI's result.
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq .total_count) || count=0
          echo "Push runs that passed on $GITHUB_SHA: $count"
          echo "passed=$([[ $count != 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    needs: passed-before
    # A branch of this repo already runs on push, so its pull request doesn't run it a second time.
    # !cancelled(), so a pull request or the weekly run, which skip passed-before, still get here,
    # while a newer push still cancels it.
    if: >-
      !cancelled() && needs.passed-before.outputs.passed != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30 # the race run alone takes about 13 minutes since the DNS resolver (#121)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git, and the token shouldn't sit in .git/config
          fetch-depth: 0 # build-ipa.sh needs the commit count for the build number
      - uses: ./.github/actions/build-tools
      - name: Build the WireGuard server
        run: scripts/build-wireguard.sh # swift test links its macOS slice
      - name: Unit tests
        run: swift test
      - name: Release script tests
        run: |
          python3 scripts/test_make_source.py
          scripts/test-next-version.sh
          scripts/test-which-release.sh
          scripts/test-release-notes.sh
          scripts/test-never-started.sh
      # Every test at full size, then the race detector on the ones that fit its speed.
      - name: WireGuard server tests
        run: go -C WireGuard test ./...
      - name: WireGuard server tests under the race detector
        # go test stops a run at 10 minutes by default, and this one is close to that on the runners.
        run: go -C WireGuard test -race -timeout 20m ./...
      - name: Fuzz the UDP replies
        run: go -C WireGuard test -run '^$' -fuzz FuzzReplyPackets -fuzztime 30s ./...
      # Fails only on a known vulnerability that Tether's code can reach. Pinned, like the actions.
      - name: Known vulnerabilities
        run: go -C WireGuard run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build the app
        run: |
          xcodegen generate --quiet
          xcodebuild -project Tether.xcodeproj -scheme Tether \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" build | tail -3
      # The same unsigned Release build a tag publishes, so a release can't be the first to find it broken.
      - name: Build Tether.ipa
        run: scripts/build-ipa.sh 0.0.0 "$RUNNER_TEMP/ipa"
