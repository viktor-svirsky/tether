# Runs on GitHub's macOS runner (building an iOS app needs Xcode). Every job gets a fresh VM, so
# pull requests from forks run it too, with a read-only token.
name: CI

# Every branch push runs it, so a branch is green before it's merged into main.
on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # named explicitly, so steps run with pipefail and a failed build can't hide behind tail

jobs:
  test:
    # A branch of this repo already runs on push, so its pull request doesn't run it a second time.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build-ipa.sh needs the commit count for the build number
      - uses: ./.github/actions/build-tools
      - name: Build the WireGuard server
        run: scripts/build-wireguard.sh # swift test links its macOS slice
      - name: Unit tests
        run: swift test
      - name: Release script tests
        run: python3 scripts/test_make_source.py
      - name: WireGuard server tests
        run: go -C WireGuard test -race ./...
      - name: Fuzz the UDP replies
        run: go -C WireGuard test -run '^$' -fuzz FuzzReplyPackets -fuzztime 30s ./...
      # Fails only on a known vulnerability that Tether's code can reach. Pinned, like the actions.
      - name: Known vulnerabilities
        run: go -C WireGuard run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build the app
        run: |
          xcodegen generate --quiet
          xcodebuild -project Tether.xcodeproj -scheme Tether \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" build | tail -3
      # The same unsigned Release build a tag publishes, so a release can't be the first to find it broken.
      - name: Build Tether.ipa
        run: scripts/build-ipa.sh 0.0.0 "$RUNNER_TEMP/ipa"
