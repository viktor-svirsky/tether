# Actions > Release > Run workflow publishes the next version of Tether from main, once CI passed on
# it. It builds an unsigned Tether.ipa and publishes it as a GitHub release with source.json for
# AltStore and SideStore, and the release creates the version tag. People add
# https://github.com/viktor-svirsky/tether/releases/latest/download/source.json once and get every
# release after that. Runs on GitHub's macOS runner, like CI.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "What goes up: patch 1.2.3 → 1.2.4, minor → 1.3.0, major → 2.0.0. The first release is 1.0.0."
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      actions: read # see whether CI passed on this commit
      contents: write # create the release and its tag
      id-token: write # sign the attestation
      attestations: write # store it
    steps:
      # CI runs more than this job does (the Go race tests, fuzzing, govulncheck), so a release waits
      # for a green CI run on this exact commit. Main runs CI on every push, so it has usually finished.
      # Only push runs count: a pull request runs the workflow from a merge commit, not this one.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq .total_count)
          if (( passed > 0 )); then
              echo "CI passed on $GITHUB_SHA"
          else
              echo "::error::CI hasn't passed on $GITHUB_SHA: it failed, is still running, or never ran. Release once it's green."
              exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the commit count, and the tags give the last version
      - uses: ./.github/actions/build-tools
      - name: Pick the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: scripts/next-version.sh "$BUMP" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: |
          scripts/build-wireguard.sh
          swift test
          python3 scripts/test_make_source.py
          scripts/test-next-version.sh
      - name: Build Tether.ipa
        run: scripts/build-ipa.sh "$VERSION" "$RUNNER_TEMP/out"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Write source.json
        run: scripts/make_source.py "$RUNNER_TEMP/out/Tether.ipa" "v$VERSION" > "$RUNNER_TEMP/out/source.json"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # GitHub signs a record that this Tether.ipa was built from this commit by this workflow.
      - name: Attest Tether.ipa
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/Tether.ipa
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        # The notes list the commits since the last release. Changes land on main without pull requests,
        # so GitHub's generated notes would be empty.
        run: |
          out=$RUNNER_TEMP/out
          {
              echo "Unsigned. Sign it with SideStore, AltStore, Feather or your own certificate, see the [README](https://github.com/$GITHUB_REPOSITORY#install-tether-on-your-iphone)."
              echo
              git log --no-merges --format='- %s' "${PREVIOUS:+$PREVIOUS..}HEAD"
              echo
              echo "SHA-256 of Tether.ipa: \`$(shasum -a 256 "$out/Tether.ipa" | cut -d' ' -f1)\`"
              echo
              echo "Check it was built here, from this release's commit: \`gh attestation verify Tether.ipa -R $GITHUB_REPOSITORY\`"
          } > "$out/notes.md"
          gh release create "v$VERSION" "$out/Tether.ipa" "$out/source.json" "$out/LICENSES.txt" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tether $VERSION" --notes-file "$out/notes.md"
