# Publishes the next version of Tether from main, once CI passed on it, in one of two ways:
#   - Main moves to a release branch (release-X.Y) and CI passes there: X.Y.0 is next.
#   - Actions > Release > Run workflow on main, for a patch, or to say what goes up by hand. When main
#     is at a release branch whose version isn't out, that version goes out whatever was typed (#141).
# It builds an unsigned Tether.ipa and publishes it as a GitHub release with source.json for
# AltStore and SideStore, and the release creates the version tag. People add
# https://github.com/viktor-svirsky/tether/releases/latest/download/source.json once and get every
# release after that. Runs on GitHub's macOS runner, like CI.
# Either way, the release job waits until Viktor approves it in the release environment
# (Settings > Environments), so nothing is published that nobody looked at (#139).
#
# A release branch releases without a manual run only when it got to the commit before main did (which-release.sh),
# so a release branch cut from main, or fast-forwarded to a fix on main, releases nothing (#120). Take
# main's fixes into a release branch with a merge commit, and push the release branch before main.
# A release branch's version can go missing if main moves on before its CI run ends (CI cancels the
# older run), or if the release branch moves after main reached it. Then run this by hand with release-X.Y.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "What goes up: patch 1.2.3 → 1.2.4, minor → 1.3.0, major → 2.0.0, or release-X.Y → X.Y.0. The first release is 1.0.0."
        # Typed, with no default, so nobody ships a release branch as a patch by leaving it as it was,
        # and a release branch can be named (#141). next-version.sh checks what was typed.
        type: string
        required: true
  # Every CI run that ends on main. The decide job lets only main at a release branch through.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  # Whether this run releases, and what goes up. A small Linux job, since CI ending on main for a
  # refactor or a test starts this workflow too, and that shouldn't wait for a Mac.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git, and the token shouldn't sit in .git/config
          sparse-checkout: scripts # for which-release.sh
      - name: What goes up
        id: bump
        env:
          INPUT: ${{ inputs.bump }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }} # which-release.sh reads the branches' push history
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
              # Main at a release branch releases that branch, so its features don't go out as a patch.
              branch=$(scripts/which-release.sh "$GITHUB_SHA")
              if [[ -n $branch && $INPUT != "$branch" ]]; then
                  echo "::notice::Main is at $branch, so this releases $branch, not $INPUT."
                  INPUT=$branch
              fi
              echo "bump=$INPUT" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          # This run gets the write token whatever started CI, so only a green CI run on a push to this
          # repo's main counts. A pull request from a fork's branch named main has head_branch main too.
          if [[ $RUN_CONCLUSION != success || $RUN_EVENT != push || $RUN_REPO != "$GITHUB_REPOSITORY" || $RUN_BRANCH != main ]]; then
              echo "::notice::Nothing to release: CI ended $RUN_CONCLUSION on a $RUN_EVENT of $RUN_REPO $RUN_BRANCH."
              exit 0
          fi
          # GITHUB_SHA is main's head now, and the attestation names it. When main moved on since this CI
          # run, the newer commit's own CI run decides.
          if [[ $RUN_SHA != "$GITHUB_SHA" ]]; then
              echo "::notice::Nothing to release: main moved on from $RUN_SHA to $GITHUB_SHA."
              exit 0
          fi
          branch=$(scripts/which-release.sh "$RUN_SHA")
          if [[ -z $branch ]]; then
              echo "::notice::Nothing to release: main isn't at a release branch whose version is still to come, or main got there first (see the log)."
              exit 0
          fi
          echo "Main is at $branch."
          echo "bump=$branch" >> "$GITHUB_OUTPUT"

  release:
    needs: decide
    if: needs.decide.outputs.bump != ''
    # One release at a time. On this job, not the workflow, so CI ending on main meanwhile can't
    # cancel a release waiting its turn.
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: macos-26
    environment: release # waits for an approval, see the top
    timeout-minutes: 30
    permissions:
      actions: read # see whether CI and the UI tests passed on this commit
      contents: write # create the release and its tag
      issues: read # the notes list the issues fixed
      id-token: write # sign the attestation
      attestations: write # store it
    steps:
      # CI runs more than this job does (the Go race tests, fuzzing, govulncheck), so a release waits
      # for a green CI run on this exact commit. Main runs CI on every push, so it has usually finished.
      # Only push runs count: a pull request runs the workflow from a merge commit, not this one.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq .total_count)
          if (( passed > 0 )); then
              echo "CI passed on $GITHUB_SHA"
          else
              echo "::error::CI hasn't passed on $GITHUB_SHA: it failed, is still running, or never ran. Release once it's green."
              exit 1
          fi
      # Model, the views, KeepAlive and Shortcuts are outside the Swift package, so the UI suite is
      # their only cover, and it runs by hand (ui-tests.yml). A release needs a green run of it on this
      # commit too, from any branch: main and the release branch are the same commit then (#140).
      - name: UI tests passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ui-tests.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          if (( passed > 0 )); then
              echo "UI tests passed on $GITHUB_SHA"
          else
              echo "::error::The UI tests haven't passed on $GITHUB_SHA. Run them (Actions > UI tests > Run workflow, on the release branch) and release once they're green."
              exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes with git, and the token shouldn't sit in .git/config
          fetch-depth: 0 # the build number is the commit count, and the tags give the last version
      - uses: ./.github/actions/build-tools
      - name: Pick the version
        id: version
        env:
          BUMP: ${{ needs.decide.outputs.bump }}
        # GITHUB_REF is main for workflow_run too, so its main-only check always passes there: decide
        # is what keeps other branches out.
        run: scripts/next-version.sh "$BUMP" >> "$GITHUB_OUTPUT"
      # An automatic release with nothing in it, a test or CI fix that reached a release branch
      # before main say, stops here (#139). A run by hand still releases what it's asked to.
      - name: Something to release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: scripts/release-notes.sh "$PREVIOUS" --require-change > /dev/null
      - name: Unit tests
        # Go too: build-tools takes the newest Go 1.27.x now, which may be newer than CI's (#145).
        run: |
          go version
          xcodebuild -version
          scripts/build-wireguard.sh
          go -C WireGuard test ./...
          swift test
          python3 scripts/test_make_source.py
          scripts/test-next-version.sh
          scripts/test-which-release.sh
          scripts/test-release-notes.sh
      - name: Build Tether.ipa
        run: scripts/build-ipa.sh "$VERSION" "$RUNNER_TEMP/out"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Write source.json
        run: scripts/make_source.py "$RUNNER_TEMP/out/Tether.ipa" "v$VERSION" > "$RUNNER_TEMP/out/source.json"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # GitHub signs a record that this Tether.ipa was built from this commit by this workflow.
      - name: Attest Tether.ipa
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/Tether.ipa
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        # The notes list the issues fixed since the last release that people using the app can see
        # (release-notes.sh), not every commit: test fixes, CI and work taken out again stay out (#110).
        run: |
          out=$RUNNER_TEMP/out
          {
              echo "Unsigned. Sign it with SideStore, AltStore, Feather or your own certificate, see the [README](https://github.com/$GITHUB_REPOSITORY#install-tether-on-your-iphone)."
              echo
              echo "Using SideStore or AltStore? [Add the source in one tap](https://$GITHUB_REPOSITORY_OWNER.github.io/${GITHUB_REPOSITORY#*/}/add/) and get every update there."
              echo
              scripts/release-notes.sh "$PREVIOUS"
              echo
              echo "SHA-256 of Tether.ipa: \`$(shasum -a 256 "$out/Tether.ipa" | cut -d' ' -f1)\`"
              echo
              echo "Check it was built here, from this release's commit: \`gh attestation verify Tether.ipa -R $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml\`"
          } > "$out/notes.md"
          gh release create "v$VERSION" "$out/Tether.ipa" "$out/source.json" "$out/LICENSES.txt" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tether $VERSION" --notes-file "$out/notes.md"
